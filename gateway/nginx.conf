server {
    listen 80;

    ########### DOMINIO: usuario ###########
    location /api/usuario/crear {
        proxy_pass http://user-creation-service:8080/users;
    }

    location ~ ^/api/usuario/leer/(.*)$ {
        proxy_pass http://user-reading-service:8081/users/$1;
    }

    location = /api/usuario/leer {
        proxy_pass http://user-reading-service:8081/users;
    }

    location /api/usuario/actualizar {
        proxy_pass http://user-update-service:8082/users;
    }

    location /api/usuario/login {
        proxy_pass http://login-service:8083/login;
    }

    location /api/usuario/logout {
        proxy_pass http://logout-service:3001/logout;
    }

    location /api/usuario/cambiar-password {
        proxy_pass http://usuario-password-change-service:3002/password;
    }

    location /api/usuario/eliminar {
        proxy_pass http://user-deletion-service:3004/delete?Content-Type=text/xml&SOAPAction=deleteUser;
    }

    location /api/usuario/asignar-rol {
        proxy_pass http://role-assignment-service:3003/assign-role;
    }

   location /api/usuario/verificar-rol {
    proxy_pass http://role-verification-service:3005/ws/verify-role;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    }


    ########### DOMINIO: union ###########
    location /api/union/subject-crear {
    proxy_pass http://subject-creation-service:3006/ws/create-subject;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    }


    location /api/union/subject-leer {
    proxy_pass http://subject-reading-service:3007/ws/subjects;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    }


    location /api/union/subject-actualizar {
    proxy_pass http://subject-update-service:3008/ws/update-subject;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    }


    location /api/union/subject-buscar {
    proxy_pass http://subject-search-service:3009/webhook/subject-search;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/union/section-crear {
    proxy_pass http://section-creation-service:3010/sections;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }


    location /api/union/section-leer {
    proxy_pass http://section-reading-service:3011/sections;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }


    location /api/union/section-actualizar {
    proxy_pass http://section-update-service:3012/webhook/update-section;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }


    location /api/union/section-eliminar {
    proxy_pass http://section-deletion-service:3014/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }


    ########### DOMINIO: enrollment ###########

    
   location /api/enrollment/crear {
    proxy_pass http://enrollment-creation-service:3016/enrollments;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }



    location /api/enrollment/leer/ {
    proxy_pass http://enrollment-reading-service:3020/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }


    location /api/enrollment/actualizar/ {
    proxy_pass http://enrollment-update-service:3021/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/enrollment/ {
        proxy_pass http://enrollment-log-service:3022/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    ########### DOMINIO: ai ###########
    location /api/ai/recomendar {
        proxy_pass http://ai-recommender-service:80;
    }


    ########### history ###########

    location /api/historial/crear {
    proxy_pass http://history-creation-service:3017/history;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }

 location /api/historial/ {
      proxy_pass http://academic-history-service:3023/history;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
}
